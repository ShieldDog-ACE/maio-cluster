<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>maio · 节点状态</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login">
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="brand">
        <span class="logo">m</span>
        <div><h1>maio</h1><p>节点控制台</p></div>
      </div>
      <label for="login-token">集群 Token</label>
      <input id="login-token" type="password" placeholder="粘贴协调者的 Token" spellcheck="false" autocomplete="current-password">
      <button class="primary" type="submit">进入</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">m</span>
        <div><strong>maio</strong><small id="app-version">v—</small></div>
      </div>
      <nav class="nav">
        <button class="active" type="button">节点状态</button>
      </nav>
      <div class="side-foot">
        <button id="logout" class="link" type="button">退出</button>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <h1>节点状态</h1>
        <div class="count">
          <strong id="node-count">0/0</strong>
          <span>在线 / 总数</span>
        </div>
      </header>

      <section class="node-bar">
        <label for="node-select">节点</label>
        <select id="node-select"></select>
      </section>

      <section id="metrics" class="metrics"></section>

      <section class="config">
        <div class="config-head"><h2>详细配置</h2><span id="config-hint" class="muted"></span></div>
        <div id="config-body" class="config-body"></div>
      </section>
    </main>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
