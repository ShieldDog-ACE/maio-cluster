# maio SYSTEM config (default commands use ~/.config/maio/maio.conf)
# Start-on-boot is on by default. Use "sudo maio --system boot 0" to disable it.

# --- model store ---
boot        = 1
models_root = "/var/lib/maio/models"
state_dir   = "/var/lib/maio"
mirror      = "https://www.modelscope.cn"

# --- HTTP service ---
host           = "127.0.0.1"
port           = 11434
# auto: require a key automatically on a non-loopback listener, generate one
# on first start. on: always require. off: only with allow_insecure = 1.
auth           = "auto"
api_key        = ""
allow_insecure = 0
cors           = 0
trust_proxy    = 0
tls_cert       = ""
tls_key        = ""
tls_ca         = ""

# --- admission control and timeouts ---
rate_limit      = 600
rate_burst      = 120
max_concurrency = 8
max_queue       = 64
queue_timeout   = 300
request_timeout = 0
max_body_mb     = 16
idle_unload     = 300
access_log      = 1

# --- llama.cpp engine ---
llama_bin  = ""
llama_lib  = ""
ctx_size   = 0
parallel   = 2
threads    = 0
kv_type    = "f16"
flash_attn = "auto"
mmap       = 1
llama_log_verbosity = 3

# --- daemon and process limits ---
memory_limit_mb = 180
max_procs       = 0
max_open_files  = 1048576
restore         = 1
# systemd User= for the generated unit; "maio" is created by the package.
run_as          = "maio"
